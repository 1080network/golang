name: Test
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build and test all modules (workspace)
        run: |
          go build ./common/... ./issuer/... ./acceptor/... ./examples/...
          go test ./common/...
